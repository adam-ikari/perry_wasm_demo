# bench.yml — 六路性能基准 (A/B/C/D/E/F) 在 GitHub Actions 上完整复现。
#
# 设计总览
# ---------
# 1. 复用现有脚本, 不重写计时逻辑:
#      A/B/C  -> tools/bench.sh              (构建 → 三路正确性 → node 基线 → 交错计时 → 冷启动)
#      D      -> tools/attribution/bench_d.sh 11   (perry 原生)
#      E/E'   -> tools/attribution/aot_e.sh 12     (WAMR AOT, 含 wamrc/AOT 运行时构建)
#      F      -> tools/attribution/bench_f.sh 11   (QuickJS)
#    本 workflow 只负责把依赖装到与本地相同的路径, 再原样调用这几个脚本 —— 步骤与本地
#    脚本的逐条对应关系见下方各 step 注释, 以及 docs/process.md「增补：性能测试迁移到 CI」。
#
# 2. runner 选 ubuntu-22.04 + LLVM 14:
#    - docs/performance.md「测量口径」的基线机就是 Ubuntu 22.04 系 (gcc 11.4.0), LLVM 14
#      (wamrc 2.4.3 用系统 LLVM 14 构建, `llvm-config --version` = 14.0.0)。
#    - WAMR 2.4.3 源码有 `#if LLVM_VERSION_MAJOR >= 19 / >= 17 / >= 14` 等守卫, LLVM 18
#      (ubuntu-24.04 默认) 理论可编译; 但 tools/attribution/aot_e.sh 第 38-40 行硬编码
#      `-I/usr/lib/llvm-14/include` 构建 AOT 运行时 —— 24.04 上没有这个路径。选 22.04 是
#      "不改禁区脚本 + 与本机等价" 的最小解, 不是能力不足。
#
# 3. 触发策略 (为什么默认不自动跑):
#    - workflow_dispatch: 手动触发, 唯一保证可执行的路径。
#    - pull_request labeled `bench`: 只有 PR 明确打上 [bench] 标签才跑 —— 性能测试一次
#      15~30 分钟 (含 WAMR 解释器 + AOT 双构建、wamrc、QuickJS、625 MB perry 下载),
#      且 runner 是共享虚拟机, 噪声远大于本机 ±15%; push 到 main 每次自动跑 = 烧额度换
#      噪声数据。需要夜间基线时, 取消 on: 里注释掉的 schedule/push 段。
#
# 4. 回归判定口径: CI runner 与本机 CPU 不同, 绝对毫秒不可比 → 只比
#    "各目标 ÷ C (原生) 的倍数" (跨机可比的形态比率), 与 docs/performance.md 记录的
#    本机比率对照, ±50% 阈值内 ok、超出仅 warning 不 fail (由 tools/ci/collect-bench.mjs
#    汇总成 build/bench-results.json; 首次运行即把本次比率当作 CI 基线随 artifact 存档)。
#
# 5. 超时: 冷跑 (无任何缓存) 估 15~30 分钟 (WAMR 双构建 + wamrc + 625MB perry 下载 +
#    六路计时); timeout-minutes 是上限不是预约, 设 60 留余量。

name: bench

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  # ---------- 可选: 需要定期基线时启用下面两段 ----------
  # schedule:
  #   - cron: "0 3 * * 1"      # 每周一 03:00 UTC 夜间跑
  # push:
  #   branches: [main]
  # 理由: 六路全量含 WAMR 双构建, 单次 15~30 分钟; 每次 push 自动跑既慢又贵,
  # 且 runner 共享 CPU 噪声大, 高频率只能得到噪声基线。定期的价值在"漂移检测",
  # 手动 + 标签已覆盖日常需要。

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

env:
  # 与 tools/attribution/bench_d.sh 第 22-25 行常量保持同步 (改版本时这里一起改)
  PERRY_VER: v0.5.1520
  PERRY_SHA256: 3423d9fea9bce9b2011fa53b5788a5ca115c947352b5c67278147de30fd2f952
  WAMR_TAG: WAMR-2.4.3
  # aot_e.sh / bench_f.sh 的默认路径 (脚本里写死的常量, 这里显式声明便于对照)
  WAMRC: /tmp/wamrc-test/wamrc
  QJS: /tmp/quickjs-bellard/qjs
  LLVM_VERSION: "14"

jobs:
  bench:
    # label 事件只在"新增"标签时触发; 只认 bench 这一个标签
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bench'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Node (与文档基线同大版本, docs 记录 Node v24.21.0)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # 不设 cache: npm —— package-lock.json 在 .gitignore 里不进仓库, setup-node
          # 的 npm cache 要求 lockfile, 会直接报错。锁文件不入库 → 用 npm install。

      - name: npm install (不用 npm ci, 锁文件不入库)
        # 等价于 demo.sh 第 30 行 `npm install --no-audit --no-fund`
        run: npm install --no-audit --no-fund

      - name: Rust wasm32 target
        # 等价于 demo.sh 第 43-45 行
        run: |
          rustup target add wasm32-unknown-unknown
          rustc --version && cargo --version

      - name: apt 依赖 (LLVM 14 + wabt)
        # llvm-14-dev: wamrc 与 AOT 运行时 (aot_e.sh 第 38-40 行 -I/usr/lib/llvm-14/include)
        #   都需要 LLVM 14 头/库; ubuntu-22.04 默认源有 llvm-14-dev。
        # wabt: aot_e.sh 第 18 行 WABT 指向的 wat2wasm (本机是 npm 全局装, CI 用 apt,
        #   版本 1.0.27, `--enable-all` 从 1.0.x 起就支持; 产物路径 /usr/bin/wat2wasm)。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-14-dev wabt
          llvm-config-14 --version
          command -v wat2wasm && wat2wasm --version

      - name: perry 原生编译器缓存 (D 路)
        # D 路每次要下 625 MB (perry-linux-x86_64.tar.gz); actions/cache 按版本+sha 缓存
        # 压缩包本体。缓存命中时下一 step 直接解压, bench_d.sh 看到 /tmp/perry-dist/perry
        # 存在就跳过下载 (等价于 bench_d.sh 第 28-38 行的跳过分支)。
        uses: actions/cache@v4
        with:
          path: /tmp/perry-dl.tar.gz
          key: perry-${{ env.PERRY_VER }}-linux-x86_64-${{ env.PERRY_SHA256 }}

      - name: perry 缓存命中则解压 (跳过下载分支)
        # 缓存恢复到 /tmp/perry-dl.tar.gz 后, 若直接交给 bench_d.sh 走 curl -C -:
        # 对已完整的 625MB 文件, 服务器若返回 200 会整包重下、若返回 416 会触发脚本内
        # 10 次重试 × 5s 空转 (实测 GitHub 返回 200, 重下整包)。这里先 sha256 校验并
        # 解压成 /tmp/perry-dist, bench_d.sh 第 28 行 `[ -x "$PERRY_DIST/perry" ]` 直接跳过。
        run: |
          if [ -f /tmp/perry-dl.tar.gz ]; then
            echo "${{ env.PERRY_SHA256 }}  /tmp/perry-dl.tar.gz" | sha256sum -c -
            rm -rf /tmp/perry-dist
            mkdir -p /tmp/perry-dist
            tar xzf /tmp/perry-dl.tar.gz -C /tmp/perry-dist
            echo "perry cache hit: 已解压 /tmp/perry-dist"
          else
            echo "perry cache miss: 首次运行, 由 bench_d.sh 自行下载"
          fi

      - name: 依赖构建 + demo 正确性 (./demo.sh)
        # 等价于 demo.sh 全链路:
        #   第 48-58 行  WAMR 2.4.3 克隆 (--depth 1 --branch WAMR-2.4.3) + 解释器构建
        #                 (.deps/wamr-build, INTERP=1 FAST_INTERP=1 MULTI_MODULE=1 AOT=0,
        #                  CMAKE_BUILD_TYPE=Release; README 提到的 LIBC_WASI/TARGET 是
        #                  linux 平台默认值, demo.sh 未显式传 = 与本机一致)
        #   第 61-73 行  perry wasm → rt.wasm (cargo wasm32) → import rt.memory 链接
        #   第 74 行起   宿主 runner 编译 + 正向/负向测试
        # 产出: .deps/wamr-build/libiwasm.a (bench.sh 第 44 行的依赖检查) + build/rt.wasm 等
        # 顺带把 demo 的 6/6 正确性作为基准前置门槛。
        run: ./demo.sh

      - name: wamrc (AOT 编译器, 系统 LLVM 14)
        # 等价于 docs/performance.md「E 手动步骤」+ aot_e.sh 第 24-31 行注释的命令:
        #   cmake -S .deps/wamr/wamr-compiler -B /tmp/wamrc-test -DWAMR_BUILD_WITH_CUSTOM_LLVM=1
        #   && cmake --build /tmp/wamrc-test -j
        # 差异: 显式 -DLLVM_DIR="$(llvm-config-14 --cmakedir)" —— ubuntu 多 LLVM 并存时
        # find_package(LLVM REQUIRED CONFIG) 需要消歧; llvm-config-14 --cmakedir 输出
        # /usr/lib/llvm-14/lib/cmake/llvm (本机 CMakeCache 实测 LLVM_DIR 同此)。
        # 产物 /tmp/wamrc-test/wamrc = aot_e.sh 第 19 行 WAMRC 默认值。
        run: |
          cmake -S .deps/wamr/wamr-compiler -B /tmp/wamrc-test \
            -DWAMR_BUILD_WITH_CUSTOM_LLVM=1 \
            -DLLVM_DIR="$(llvm-config-14 --cmakedir)"
          cmake --build /tmp/wamrc-test -j "$(nproc)"
          /tmp/wamrc-test/wamrc --version

      - name: QuickJS (F 路)
        # 等价于 attribution/README.md + bench_f.sh 第 15 行 QJS 默认路径:
        #   克隆 bellard 官方 quickjs 到 /tmp/quickjs-bellard, `make qjs` 只建解释器不装系统。
        # (任务书写 /tmp/quickjs; 这里用脚本默认 /tmp/quickjs-bellard, 少一个环境变量)
        run: |
          git clone --depth 1 https://github.com/bellard/quickjs /tmp/quickjs-bellard
          make -C /tmp/quickjs-bellard qjs -j "$(nproc)"
          ls -la "$QJS"

      - name: WABT 路径注入
        # aot_e.sh 第 18 行 `WABT="${WABT:-...}"` 按设计接受环境变量覆盖; 指向 apt 装的
        # wat2wasm 绝对路径 (脚本里 WABT 是"二进制全路径", 不是目录)。
        run: echo "WABT=$(command -v wat2wasm)" >> "$GITHUB_ENV"

      - name: 工具链自检 (环境快照)
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH $ImageOS $(nproc) 核"
          grep -m1 'model name' /proc/cpuinfo
          df -h / | tail -1
          echo "node $(node -v) / gcc $(gcc -dumpfullversion) / cargo $(cargo --version) / llvm $(llvm-config-14 --version)"
          .deps/wamr-build/iwasm --version 2>&1 | head -1
          "$WAMRC" --version
          "$QJS" --version 2>&1 | head -1 || true

      # ---------------------------------------------------------------- 六路计时
      - name: "A/B/C: tools/bench.sh (11 轮, warmup 弃, 中位数)"
        # 原样调用: 构建三路产物 → 三路输出一致校验 (fib(29)=514229, sum=499999500000)
        # → node 启动基线扣除 → A B C 交错 11 轮 → 冷启动 5 次 → build/bench_table.txt
        run: ./tools/bench.sh

      - name: "D: tools/attribution/bench_d.sh 11 (perry 原生)"
        # 原样调用; 缓存命中时下载分支被跳过 (见上), 其余流程完全一致:
        # 下载/校验 → perry compile → 输出校验 → 进程级计时 11 轮 → build/d_runs.txt
        run: ./tools/attribution/bench_d.sh 11

      - name: "E/E': tools/attribution/aot_e.sh 12 (WAMR AOT)"
        # 原样调用: 内部自建 build/wamr-aot-build (AOT=1 + CUSTOM_LLVM=1 + LLVM14 include)
        # → wasm-merge 合并单模块 → patch_merged.mjs → wasm-as → wamrc → aot_time 计时
        # (E 每进程 1 轮 × 12, E' 进程内 12 轮) → build/e_runs.txt / eprime_runs.txt
        run: ./tools/attribution/aot_e.sh 12

      - name: "F: tools/attribution/bench_f.sh 11 (QuickJS)"
        # 原样调用: 输出校验 → bench_exec_wrap 进程级计时 11 轮 → build/f_runs.txt
        run: ./tools/attribution/bench_f.sh 11

      - name: 汇总 + 回归判定 → build/bench-results.json
        # 读取 build/{a,b,c,d,e,eprime,f}_runs.txt, 算中位数/比率, 与文档本机基线比率对照
        # (±50% warning 不 fail); 输出 machine-readable JSON + 汇总表, 详见脚本头注释。
        run: node tools/ci/collect-bench.mjs

      - name: 上传 artifact (含失败时)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            build/bench-results.json
            build/bench_ci_table.txt
            build/bench_table.txt
            build/bench_results.txt
            build/*_runs.txt
          retention-days: 90
